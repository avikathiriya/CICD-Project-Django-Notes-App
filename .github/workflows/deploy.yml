name: Django Notes App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-notes-production
  cancel-in-progress: false

jobs:
  test:
    name: Test application and Docker image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testrootpassword
          MYSQL_DATABASE: notesdb
          MYSQL_USER: notesuser
          MYSQL_PASSWORD: testapppassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestrootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: testapppassword
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            default-libmysqlclient-dev \
            pkg-config

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify required packages and modules
        run: |
          python -c "import django, rest_framework, corsheaders, MySQLdb"
          python -c "import notesapp, api"
          python -m pip check

      - name: Check Django configuration
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

      - name: Build Docker image for validation
        run: docker build -t django-notes-app:test .

      - name: Verify environment variables inside image
        run: |
          docker run --rm --entrypoint python django-notes-app:test -c "
          import os
          assert os.environ.get('PYTHONDONTWRITEBYTECODE') == '1'
          assert os.environ.get('PYTHONUNBUFFERED') == '1'
          assert os.environ.get('PORT') == '8000'
          print('Image environment validation passed')
          "

  build_push:
    name: Build and push image to ECR
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:

          role-to-assume: arn:aws:iam::829188654694:role/GitHubActionsECRPushRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push versioned image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          docker build --pull -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build_push

    steps:
      - name: Deploy image on EC2 over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_URI: ${{ needs.build_push.outputs.image_uri }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_URI,AWS_REGION
          script: |
            set -eu

            cd /opt/notes-app

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin \
                "$(printf '%s' "$IMAGE_URI" | cut -d/ -f1)"

            docker pull "$IMAGE_URI"

            docker network create notes-network 2>/dev/null || true

            if ! docker container inspect notes-db >/dev/null 2>&1; then
              docker run -d \
                --name notes-db \
                --network notes-network \
                --restart unless-stopped \
                --env-file /opt/notes-app/mysql.env \
                -v /opt/notes-app/mysql-data:/var/lib/mysql \
                mysql:8.0
            fi

            READY=0
            for i in $(seq 1 60); do
              if docker exec notes-db \
                mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 5
            done

            if [ "$READY" -ne 1 ]; then
              docker logs --tail 100 notes-db
              echo "MySQL did not become ready"
              exit 1
            fi

            docker run --rm \
              --network notes-network \
              --env-file /opt/notes-app/app.env \
              "$IMAGE_URI" \
              python manage.py migrate --noinput

            docker rm -f django-notes-app 2>/dev/null || true

            docker run -d \
              --name django-notes-app \
              --network notes-network \
              --restart unless-stopped \
              --env-file /opt/notes-app/app.env \
              -p 8000:8000 \
              "$IMAGE_URI"

            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" -ne 1 ]; then
              docker logs --tail 100 django-notes-app
              echo "Application health check failed"
              exit 1
            fi

            echo "Deployment completed successfully"

  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [test, build_push, deploy]
    if: always()

    steps:
      - name: Send pipeline result to Slack
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build_push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ.get("WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("SLACK_WEBHOOK_URL is not configured")

          if not webhook.startswith("https://hooks.slack.com/"):
              raise SystemExit("SLACK_WEBHOOK_URL does not look like a Slack incoming webhook URL")

          results = {
              "Tests": os.environ["TEST_RESULT"],
              "ECR build/push": os.environ["BUILD_RESULT"],
              "EC2 deployment": os.environ["DEPLOY_RESULT"],
          }

          success = all(value == "success" for value in results.values())
          status = "SUCCESS" if success else "FAILED"

          details = "\n".join(
              f"• {name}: {result}"
              for name, result in results.items()
          )

          message = (
              f"Django Notes App CI/CD: {status}\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Branch: {os.environ['BRANCH']}\n"
              f"Commit: {os.environ['COMMIT_SHA'][:12]}\n"
              f"{details}\n"
              f"Run: {os.environ['RUN_URL']}"
          )

          request = urllib.request.Request(
              webhook,
              data=json.dumps({"text": message}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  if response.status < 200 or response.status >= 300:
                      raise SystemExit(f"Slack notification failed: HTTP {response.status}")
                  if body.strip() != "ok":
                      raise SystemExit(f"Slack webhook returned an unexpected response: {body}")
                  print("Slack notification sent")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Slack webhook returned HTTP {error.code}") from error
          except urllib.error.URLError as error:
              raise SystemExit(f"Could not connect to Slack webhook: {error.reason}") from error
          PY
